#CrossOrigins
client.url=http://localhost:4200


#Change default server port
#server.port=9000

#prevent the application from stop if database is down
spring.sql.init.continue-on-error=true

# Necesario para springfox 2.x con Spring Boot 2.7.x (cambio de path matching por defecto)
spring.mvc.pathmatch.matching-strategy=ant_path_matcher


#DATABASE_____________________________________________
# Valores por defecto para desarrollo local (MySQL/MariaDB).
# Se sobreescriben con variables de entorno en Docker (SPRING_DATASOURCE_URL, etc.).
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/db_fichajespi
spring.datasource.username=fichajes
spring.datasource.password=fichajes
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# mostrar sentencias SQL en la consola
spring.jpa.show-sql = false

# Dialecto omitido a propósito: Spring Boot lo auto-detecta según el driver/JDBC URL,
# lo que permite cambiar entre MySQL y PostgreSQL sin tocar código.


#EMAIL_________________________________________________
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=xxx
spring.mail.password=xxx

# Other properties
spring.mail.properties.mail.smtp.auth=true

# TLS , port 587
spring.mail.properties.mail.smtp.starttls.enable=true
# SSL, post 465
#spring.mail.properties.mail.smtp.socketFactory.port = 465
#spring.mail.properties.mail.smtp.socketFactory.class = javax.net.ssl.SSLSocketFactory

# security
jwt.secret = very-secure-secret
#mili segundos
jwt.expiration = 36000000

